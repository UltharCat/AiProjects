server:
  port: ${GATEWAY_SERVER_PORT:8080}
spring:
  application:
    name: knowledge-agent-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis}
      timeout: ${REDIS_TIMEOUT:5s}
dubbo:
  application:
    name: knowledge-agent-gateway
    qos-enable: false
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://localhost:8848?username=nacos&password=nacos}
    register-mode: instance
    check: false
    use-as-config-center: false
    use-as-metadata-center: false
  consumer:
    check: false
  config-center:
    address: ${DUBBO_CONFIG_CENTER_ADDRESS:N/A}
knowledge-agent:
  auth:
    token-issuer: ${KNOWLEDGE_AGENT_TOKEN_ISSUER:knowledge-agent-platform}
    token-secret: ${KNOWLEDGE_AGENT_TOKEN_SECRET:knowledge-agent-dev-secret}
    token-ttl: ${KNOWLEDGE_AGENT_TOKEN_TTL:PT12H}
  review:
    dedup-window: ${KNOWLEDGE_AGENT_REVIEW_DEDUP_WINDOW:PT30M}
    batch-ttl: ${KNOWLEDGE_AGENT_REVIEW_BATCH_TTL:PT24H}
    redis-key-prefix: ${KNOWLEDGE_AGENT_REVIEW_REDIS_KEY_PREFIX:knowledge-agent:review}
    scheduler:
      enabled: ${KNOWLEDGE_AGENT_REVIEW_SCHEDULER_ENABLED:true}
      batch-limit: ${KNOWLEDGE_AGENT_REVIEW_SCHEDULER_BATCH_LIMIT:5}
      initial-delay-ms: ${KNOWLEDGE_AGENT_REVIEW_SCHEDULER_INITIAL_DELAY_MS:30000}
      fixed-delay-ms: ${KNOWLEDGE_AGENT_REVIEW_SCHEDULER_FIXED_DELAY_MS:900000}
