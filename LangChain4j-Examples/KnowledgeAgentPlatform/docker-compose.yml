name: knowledge-agent-platform
services:
  # 1. Nacos (Registry & Config)
  nacos:
    image: nacos/nacos-server:latest
    container_name: nacos-server
    networks:
      - knet
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 1g
      NACOS_AUTH_ENABLE: true
      NACOS_AUTH_TOKEN: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MA==
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
    ports:
      - "8091:8080"
      - "8848:8848"
      - "9848:9848"
    volumes:
      - k-nacos-logs:/home/nacos/logs
      - k-nacos-data:/home/nacos/data

  # 2. Redis (Short-term Memory)
  redis:
    image: redis:latest
    container_name: agent-redis
    networks:
      - knet
    ports:
      - "6379:6379"
    volumes:
      - k-redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redis"]

  # 3. MySQL (User & Core DB)
  mysql:
    image: mysql:latest
    container_name: agent-mysql
    networks:
      - knet
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: knowledge_agent
    ports:
      - "3306:3306"
    volumes:
      - k-mysql-data:/var/lib/mysql

  # 4. PostgreSQL with pgvector (Vector Store)
  postgres:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: agent-postgres
    networks:
      - knet
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_rag
    ports:
      - "5432:5432"
    volumes:
      - k-pgvector-data:/var/lib/postgresql

  # 5. Neo4j (Knowledge Graph)
  neo4j:
    image: neo4j:latest
    container_name: agent-neo4j
    networks:
      - knet
    environment:
      NEO4J_AUTH: neo4j/agentneo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - k-neo4j-data:/data
      - k-neo4j-logs:/logs

  # 6. RocketMQ (Messaging) - Optional for Phase 1
  rmqnamesrv:
    image: apache/rocketmq:latest
    container_name: rmqnamesrv
    networks:
      - knet
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rmqbroker:
    image: apache/rocketmq:latest
    container_name: rmqbroker
    networks:
      - knet
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    depends_on:
      - rmqnamesrv
    command: sh mqbroker

  rmqproxy:
    image: apache/rocketmq:latest
    container_name: rmqproxy
    networks:
      - knet
    depends_on:
      - rmqbroker
      - rmqnamesrv
    ports:
      - "8092:8080"
      - "8093:8081"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    command: sh mqproxy

  rmqdashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmqdashboard
    networks:
      - knet
    depends_on:
      - rmqnamesrv
    ports:
      - "8094:8082"
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rmqnamesrv:9876
    volumes:
      - k-rmq-tmp:/tmp

volumes:
  k-nacos-logs:
  k-nacos-data:
  k-redis-data:
  k-mysql-data:
  k-pgvector-data:
  k-neo4j-logs:
  k-neo4j-data:
  k-rmq-tmp:

networks:
  knet:
    driver: bridge