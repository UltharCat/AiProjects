server:
  port: ${CORE_SERVER_PORT:8083}
spring:
  application:
    name: knowledge-agent-core
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis}
      timeout: ${REDIS_TIMEOUT:5s}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
dubbo:
  application:
    name: knowledge-agent-core
    qos-enable: false
  protocol:
    name: tri
    port: ${CORE_DUBBO_PORT:50053}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://localhost:8848?username=nacos&password=nacos}
    register-mode: instance
    check: false
    use-as-config-center: false
    use-as-metadata-center: false
  consumer:
    check: false
  config-center:
    address: ${DUBBO_CONFIG_CENTER_ADDRESS:N/A}
knowledge-agent:
  llm:
    enabled: ${KNOWLEDGE_AGENT_LLM_ENABLED:false}
    base-url: ${KNOWLEDGE_AGENT_LLM_BASE_URL:}
    api-key: ${KNOWLEDGE_AGENT_LLM_API_KEY:}
    model-name: ${KNOWLEDGE_AGENT_LLM_MODEL_NAME:gpt-4o-mini}
    timeout: ${KNOWLEDGE_AGENT_LLM_TIMEOUT:PT20S}
  messaging:
    enabled: ${KNOWLEDGE_AGENT_MESSAGING_ENABLED:false}
    review-batch-topic: ${KNOWLEDGE_AGENT_REVIEW_BATCH_TOPIC:knowledge-agent-review-batch}
    review-batch-consumer-group: ${KNOWLEDGE_AGENT_REVIEW_BATCH_CONSUMER_GROUP:knowledge-agent-core-review-consumer}
    knowledge-archived-topic: ${KNOWLEDGE_AGENT_KNOWLEDGE_ARCHIVED_TOPIC:knowledge-agent-knowledge-archived}
    knowledge-archived-consumer-group: ${KNOWLEDGE_AGENT_KNOWLEDGE_ARCHIVED_CONSUMER_GROUP:knowledge-agent-core-knowledge-consumer}
