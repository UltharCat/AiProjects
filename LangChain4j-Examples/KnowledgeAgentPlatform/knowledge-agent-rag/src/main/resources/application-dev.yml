server:
  port: 8082
spring:
  application:
    name: knowledge-agent-rag
  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
langchain4j:
  open-ai:
    embedding-model:
      api-key: ${GEMINI_API_KEY}
      base-url: ${AGENT_URL}
      model-name: gemini-embedding-001
      dimensions: 1536
milvus:
  cloud:
    url: ${MILVUS_CLOUD_URL}
    collection-name: knowledge_rag_collection
    token: ${MILVUS_CLOUD_TOKEN}
    dimension: 1024
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开发环境打印SQL
dubbo:
  application:
    name: knowledge-rag
  protocol:
    name: tri
    port: 50052
  registry:
    address: nacos://localhost:8848?username=nacos&password=nacos
    register-mode: instance
