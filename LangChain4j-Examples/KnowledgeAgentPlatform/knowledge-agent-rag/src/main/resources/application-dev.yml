server:
  port: 8082
spring:
  application:
    name: knowledge-agent-rag
  datasource:
    url: ${RAG_DB_URL:jdbc:mysql://localhost:3306/knowledge_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${RAG_DB_USERNAME:root}
    password: ${RAG_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
langchain4j:
  open-ai:
    embedding-model:
      api-key: ${GEMINI_API_KEY}
      base-url: ${AGENT_URL}
      model-name: gemini-embedding-001
      dimensions: 1536
milvus:
  cloud:
    url: ${MILVUS_CLOUD_URL}
    collection-name: knowledge_rag_collection
    token: ${MILVUS_CLOUD_TOKEN}
    dimensions: 1024
dubbo:
  application:
    name: knowledge-rag
  protocol:
    name: tri
    port: 50052
  registry:
    address: nacos://localhost:8848?username=nacos&password=nacos
    register-mode: instance
