server:
  port: 8082
spring:
  application:
    name: knowledge-agent-rag
  # PostgreSQL / PgVector Configuration
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/knowledge_rag
    # Default username/password from roadmap/docker
    username: postgres
    password: ${postgresql.password}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-on-borrow: false
      test-while-idle: true
      pool-prepared-statements: true
  # Flyway Configuration for Postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Neo4j Configuration (Moved under spring)
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ${neo4j.password}
langchain4j:
  # LLM Config (Placeholders for now, focusing on Store)
  # Vector Store Specifics will be in Java Config using Datasource
  pgvector:
    table-name: embeddings
    dimension: 1536
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
dubbo:
  application:
    name: knowledge-rag
  protocol:
    name: tri
    port: 50052
  registry:
    address: nacos://localhost:8848?username=nacos&password=nacos
    register-mode: instance
