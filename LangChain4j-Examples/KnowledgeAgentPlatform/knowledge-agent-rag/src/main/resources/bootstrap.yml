spring:
  config:
    import[0]: optional:nacos:knowledge-agent-rag?group=${NACOS_CONFIG_GROUP:KNOWLEDGE_AGENT}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
