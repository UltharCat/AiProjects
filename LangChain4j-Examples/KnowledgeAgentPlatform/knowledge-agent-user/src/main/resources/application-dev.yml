server:
  port: 8081
spring:
  application:
    name: knowledge-agent-user
  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_agent?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_user
    baseline-version: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开发环境打印SQL
dubbo:
  application:
    name: knowledge-user
  protocol:
    name: tri
    port: 50051
  registry:
    address: nacos://localhost:8848?username=nacos&password=nacos
    register-mode: instance
