server:
  port: ${USER_SERVER_PORT:8081}
spring:
  application:
    name: knowledge-agent-user
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/knowledge_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${USER_DB_USERNAME:root}
    password: ${USER_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${USER_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_user
    baseline-version: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
dubbo:
  application:
    name: knowledge-user
    qos-enable: false
  protocol:
    name: tri
    port: ${USER_DUBBO_PORT:50051}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://localhost:8848?username=nacos&password=nacos}
    register-mode: instance
    check: false
    use-as-config-center: false
    use-as-metadata-center: false
  config-center:
    address: ${DUBBO_CONFIG_CENTER_ADDRESS:N/A}
knowledge-agent:
  auth:
    token-issuer: ${KNOWLEDGE_AGENT_TOKEN_ISSUER:knowledge-agent-platform}
    token-secret: ${KNOWLEDGE_AGENT_TOKEN_SECRET:knowledge-agent-dev-secret}
    token-ttl: ${KNOWLEDGE_AGENT_TOKEN_TTL:PT12H}
